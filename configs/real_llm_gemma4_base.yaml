# Gemma-4-E4B 真实 LLM profile 配置。
# 用于生成 clean PPL、embedding-drop PPL 曲线和后续 curve surrogate 校准数据。

model_id: google/gemma-4-E4B     # Hugging Face 模型名。
cache_dir: null                  # 模型缓存目录；null 表示使用默认 HF cache。
device: cuda                     # 真实 LLM 前向计算设备。
device_map: auto                 # 允许 transformers 自动放置模型权重。
dtype: bfloat16                  # 加载模型时使用的数据类型。
trust_remote_code: true          # Gemma/Qwen 等模型通常需要开启。
max_length: 96                   # PPL 计算的最大 token 长度。
smoke_max_length: 48             # smoke 部署测试时更短的长度。
stride: 96                       # 长文本滑窗步长；等于 max_length 时不重叠。
num_texts: 16                    # 从数据集抽取多少条文本做 PPL/profile。
batch_size: 1                    # 真实 LLM PPL batch size；显存不够时保持 1。
drop_rates: [0.0, 0.01, 0.03, 0.05]  # embedding corruption 网格。
corruption_trials: 2             # 每个 drop rate 重复次数。
seed: 123                        # profile 随机种子。
output_dir: results/gemma4_e4b/gemma4_e4b_real_profile

# 优先从 Wikitext-2 validation 抽文本；如果下载失败则回退到下面 texts 列表。
dataset:
  name: wikitext
  config: wikitext-2-raw-v1
  split: validation
  min_chars: 120

# 数据集不可用时的 fallback 文本。
texts:
  - "Distributed language model inference can be accelerated by placing layers across UAV edge devices."
  - "Wireless packet loss affects retransmission delay and may degrade intermediate activations."
  - "The policy selects a feasible model partition under memory, energy, latency, and reliability constraints."
  - "A calibrated surrogate approximates perplexity changes from corrupted hidden states."
