# Qwen3.5-4B 主实验配置。
# README 里的 Qwen3.5-4B 训练和 benchmark 命令都直接读取这个文件。
# 只改注释不会影响复现；改数值后需要重新训练和重新跑 benchmark。

# 全局随机种子：控制 UAV 状态采样、网络初始化和训练/测试随机性。
seed: 42

# LLM 结构和 PPL surrogate 配置。
# num_layers 决定 RL 动作长度；hidden/intermediate/head 参数用于估算每层资源占用。
# real_profile_dir 指向真实 LLM profile，里面包含 clean PPL、真实测得的 drop-PPL 曲线/层敏感度。
profile:
  model_name: Qwen3.5-4B         # 报告里显示的模型名称。
  num_layers: 32                 # Transformer 层数；RL 每个 episode 输出 32 个 UAV 分配决策。
  hidden_size: 2560              # hidden dimension，用于估算 activation 和层计算量。
  intermediate_size: 9216        # FFN 中间层维度，用于估算每层参数/计算量。
  num_attention_heads: 16
  num_key_value_heads: 4
  head_dim: 256
  dtype_bytes: 2                 # bfloat16/float16 约等于 2 bytes。
  sequence_length: 64            # profile 和 simulator 默认使用的序列长度。
  ppl_ref: 12.508157074727082    # clean PPL，作为 PPL_hat 的基准。
  ppl_gamma: 196.06855947881232  # 兼容旧全局指数 surrogate；真实 profile 存在时优先用 profile 内校准结果。
  real_profile_dir: results/qwen35_4b_real_profile_v2
  surrogate_mode: linear         # 使用层级线性/指数损伤 surrogate。
  layer_compute_jitter: 0.12     # 给每层计算量加入轻微扰动，避免所有层完全同质。
  activation_jitter: 0.08        # 给层间 activation 大小加入轻微扰动。

# UAV 环境配置。
# 4B 模型比 0.6B 大，所以这里的 mem/energy 区间也更高。
# memory 和 energy 是硬约束：违反后会触发 repair/projection，仍不可行则给 infeasible_reward。
uav:
  num_uavs: 5                    # UAV 数量，也是 RL 每层动作的类别数。
  area_m: 1000.0                 # UAV 随机分布区域边长。
  altitude_m: 100.0              # 固定飞行高度，用于信道距离计算。
  compute_ghz_min: 3.5           # 每个 UAV 计算能力采样下界。
  compute_ghz_max: 8.0
  mem_mb_min: 1800.0             # 4B 模型对应的 UAV 显存/内存下界。
  mem_mb_max: 3200.0
  energy_j_min: 2000.0           # 单次任务可用能量预算下界。
  energy_j_max: 3600.0
  tx_power_w: 1.0                # 传输功率，用于通信能耗。
  compute_power_base_w: 1.5      # 计算功耗基础项。
  compute_power_per_ghz_w: 0.45  # 计算功耗随 compute GHz 增加的线性项。
  hover_power_w_min: 35.0        # 悬停功耗采样下界。
  hover_power_w_max: 70.0

# 无线链路配置。
# PDP 由 SNR 与阈值关系得到；retransmissions=1 时 residual loss = PDP^(1+1)=PDP^2。
# bandwidth_allocation=kkt_closed_form 使用凸优化 KKT 条件推导出的闭式解，和对应凸问题最优解一致。
wireless:
  bandwidth_hz: 2000000.0        # 系统总带宽。
  bandwidth_allocation: kkt_closed_form
  noise_power_w: 1.0e-12
  snr_threshold: 10.0            # SNR 低于阈值时 PDP 增大。
  h0: 1.0e-05                    # 参考信道增益。
  path_loss_exp: 2.15            # 路损指数。
  rayleigh_scale: 1.0            # Rayleigh fading 尺度。
  min_rate_bps: 1000.0           # 防止极端链路速率为 0 的数值下界。
  retransmissions: 1             # 允许 1 次重传；影响通信时延和 residual activation loss。

# Reward 配置。
# feasible 时 reward = -[alpha * PPL_norm + beta * latency_norm]。
# PPL_norm=(PPL_hat-PPL_ref)/PPL_ref，latency_norm=latency_s/latency_ref_s。
reward:
  alpha: 0.4                     # PPL 质量项权重。
  beta: 0.6                      # latency 时延项权重。
  infeasible_reward: -100.0      # 硬约束不可行时的固定惩罚。
  latency_ref_s: 20.0            # 4B 模型 latency 归一化参考值。
  repair_energy_iters: 4         # 能耗 repair 的迭代次数。

# 强启发式 baseline 配置。
# benchmark 会用这些启发式和 RL 公平对比；RL inference 不会把启发式动作塞进候选池。
heuristics:
  include_simple_heuristics_in_dros: true
  local_search_passes: 2
  local_search_seed_tries: 64
  include_local_search_in_dros: true
  evaluate_strong_baseline: true

# 当前 README 使用的 autoregressive RL 主训练配置。
# 训练命令：python -m src.train_autoreg_rl --config configs/qwen35_4b_calibrated.yaml
ar_rl:
  result_dir: results/autoreg_rl_qwen35_4b_v2_teacher_big
  episodes: 1000                 # 当前 tracked checkpoint 的训练轮数。
  batch_states: 32               # 每个 episode 采样多少个环境 state。
  candidates: 256                # 训练时每个 state 从 policy 采样多少个完整分配候选。
  eval_candidates: 256           # validation/benchmark 的默认 RL 候选数 k。
  validation_states: 160         # 训练过程中固定 validation state 数。
  eval_interval: 50              # 每隔多少 episode 做一次 validation。
  elite_fraction: 0.08           # self-imitation replay 中保留 top 候选比例。
  replay_capacity: 100000
  batch_size: 512                # policy-gradient/replay 更新 batch size。
  replay_updates_per_step: 1
  learning_rate: 0.0004
  weight_decay: 0.0001
  hidden_dim: 512                # policy 网络隐藏维度。
  depth: 3                       # policy MLP/RNN head 深度。
  dropout: 0.03
  temperature_start: 1.2         # 训练早期采样温度，鼓励探索。
  temperature_end: 0.35          # 训练后期采样温度，偏向 exploitation。
  eval_temperature: 0.30         # benchmark 时的默认采样温度。
  eval_temperatures: [0.12, 0.2, 0.3, 0.45]  # beam candidate 会混合多组温度。
  greedy_candidates: 1           # 额外加入 greedy policy 候选数。
  policy_refine_steps: 0
  policy_refine_extra_candidates: 128
  policy_refine_temp_start: 0.02
  policy_refine_temp_end: 0.001
  entropy_coef_start: 0.02       # 熵正则初始值，防止过早坍缩。
  entropy_coef_end: 0.002
  advantage_scale: 4.0           # advantage 放大系数。
  reward_clip: 8.0               # 限制极端 reward/advantage，稳定训练。
  infeasible_penalty: 2.5        # 可微训练损失里的不可行惩罚。
  infeasible_cost_weight: 0.02
  grad_clip: 1.0
  teacher_states: 0              # 当前 tracked checkpoint 未使用 teacher warm-start。
  teacher_updates: 0             # 当前 tracked checkpoint 未使用 teacher warm-start。
  teacher_beam_width: 32         # teacher 搜索里的 beam 宽度。
  teacher_anneal_steps: 128      # teacher 搜索里的 simulated annealing 步数。
  teacher_eval_interval: 200
  projection_mode: blocks        # 将分配投影成连续 layer block，符合分布式流水式切分。
  max_blocks: 5                  # 最多 5 个连续 block，通常不超过 UAV 数。
  candidate_mode: beam           # inference 用 beam policy candidate，而不是纯随机采样。
  candidate_overgenerate: 2      # 先多采样再去重，增加纯 RL 候选覆盖率。
  beam_temperature: 0.9
  teacher_top_k: 6               # 每个 teacher state 保留 top-k 动作作为监督。
  teacher_weight_tau: 0.012      # teacher 动作权重温度，越小越偏向最好动作。
  teacher_min_margin: 0.03       # teacher 动作相对 baseline 的最小筛选 margin。
  hard_benchmark_rows: results/benchmark_qwen35_4b_v2_teacher_big_5seed/benchmark_rows.csv
  hard_margin_threshold: 0.0     # 只采样 RL 输给 best_nonrl 的 hard states。
  hard_max_states: 32            # 最多保留 32 个最难 state。
  hard_fraction: 0.5             # 每个训练 batch 中 hard states 的比例。
  hard_weight_scale: 120.0       # 负 margin 转成训练权重的放大系数。
  hard_max_weight: 12.0          # hard-state 权重上限，防止少数 outlier 过拟合。
  hard_baseline: best_nonrl      # hard-state 加权时使用的非 RL 参考 baseline。
  hard_teacher_repeats: 8        # hard-state 的最优非 RL 动作额外灌入 replay 的重复次数。
  device: cuda                   # policy 训练/推理设备。

# 当前 README 使用的 benchmark 配置。
# benchmark 命令会读取这里的 policy、state 数、seed 列表和强 baseline 搜索预算。
benchmark:
  real_dir: results/qwen35_4b_real_profile_v2
  policy: results/autoreg_rl_qwen35_4b_v2_teacher_big/autoreg_policy_best.pt
  out: results/benchmark_qwen35_4b_v2_teacher_big_5seed
  states: 16                     # 每个 seed 采样 16 个测试 state，总数 16*5=80。
  seeds: "91,92,93,94,95"        # 多 seed benchmark，README 表格来自这些结果。
  beam_width: 32                 # 非 RL beam_search/block_beam baseline 预算。
  anneal_steps: 128              # simulated annealing / LNS 类 baseline 预算。
  autoreg_candidates: 256        # RL benchmark 候选池大小 k。
  device: cuda

# 旧 DROS 输出目录，当前 README 主流程不使用。
output:
  result_dir: results/qwen35_4b_calibrated
