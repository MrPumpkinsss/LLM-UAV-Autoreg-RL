# Qwen3-0.6B no-retransmission 消融配置。
# 与主配置的关键差异：
# 1. wireless.retransmissions=0，因此 residual activation loss = raw PDP。
# 2. reward.ppl_cost_mode=log，用 log(1+PPL_norm) 抑制 raw PDP 下的极端 PPL outlier。
# 3. real_profile_dir 指向 raw-drop dense profile，避免把 r=1 的校准曲线外推得太远。
seed: 42

profile:
  model_name: Qwen3-0.6B
  num_layers: 28
  hidden_size: 1024
  intermediate_size: 3072
  num_attention_heads: 16
  num_key_value_heads: 8
  head_dim: 128
  dtype_bytes: 2
  sequence_length: 128
  ppl_ref: 30.824672354565333
  ppl_gamma: 10.899647591669423
  real_profile_dir: results/qwen3_0p6b_real_profile_raw_dense
  surrogate_mode: curve
  layer_compute_jitter: 0.12
  activation_jitter: 0.08

uav:
  num_uavs: 5
  area_m: 1000.0
  altitude_m: 100.0
  compute_ghz_min: 3.5
  compute_ghz_max: 8.0
  mem_mb_min: 180.0
  mem_mb_max: 320.0
  energy_j_min: 900.0
  energy_j_max: 1600.0
  tx_power_w: 1.0
  compute_power_base_w: 1.5
  compute_power_per_ghz_w: 0.45
  hover_power_w_min: 35.0
  hover_power_w_max: 70.0

wireless:
  bandwidth_hz: 2000000.0
  bandwidth_allocation: kkt_closed_form
  noise_power_w: 1.0e-12
  snr_threshold: 10.0
  h0: 1.0e-05
  path_loss_exp: 2.15
  rayleigh_scale: 1.0
  min_rate_bps: 1000.0
  retransmissions: 0

reward:
  alpha: 0.4
  beta: 0.6
  ppl_cost_mode: log
  ppl_cost_cap: null
  infeasible_reward: -100.0
  latency_ref_s: 6.0
  repair_energy_iters: 4

heuristics:
  include_simple_heuristics_in_dros: true
  local_search_passes: 2
  local_search_seed_tries: 64
  include_local_search_in_dros: true
  evaluate_strong_baseline: true

ar_rl:
  result_dir: results/autoreg_rl_qwen3_0p6b_no_retrans_logcost_hard
  episodes: 800
  batch_states: 32
  candidates: 256
  eval_candidates: 256
  validation_states: 160
  eval_interval: 50
  elite_fraction: 0.08
  replay_capacity: 100000
  batch_size: 512
  replay_updates_per_step: 1
  learning_rate: 0.0004
  weight_decay: 0.0001
  hidden_dim: 512
  depth: 3
  dropout: 0.03
  temperature_start: 1.2
  temperature_end: 0.35
  eval_temperature: 0.30
  eval_temperatures: [0.12, 0.2, 0.3, 0.45]
  greedy_candidates: 1
  policy_refine_steps: 0
  policy_refine_extra_candidates: 128
  policy_refine_temp_start: 0.02
  policy_refine_temp_end: 0.001
  entropy_coef_start: 0.02
  entropy_coef_end: 0.002
  advantage_scale: 4.0
  reward_clip: 8.0
  infeasible_penalty: 2.5
  infeasible_cost_weight: 0.02
  grad_clip: 1.0
  teacher_states: 0
  teacher_updates: 0
  teacher_beam_width: 32
  teacher_anneal_steps: 128
  teacher_eval_interval: 200
  teacher_top_k: 6
  teacher_weight_tau: 0.012
  teacher_min_margin: 0.03
  projection_mode: blocks
  max_blocks: 5
  candidate_mode: beam
  candidate_overgenerate: 2
  beam_temperature: 0.9
  hard_baseline: best_nonrl
  hard_benchmark_rows: results/autoreg_rl_qwen3_0p6b_no_retrans_logcost_hard/hard_states_used.csv
  hard_margin_threshold: 0.0
  hard_max_states: 96
  hard_fraction: 0.5
  hard_weight_scale: 120.0
  hard_max_weight: 12.0
  hard_teacher_repeats: 8
  device: cuda

benchmark:
  real_dir: results/qwen3_0p6b_real_profile_raw_dense
  policy: results/autoreg_rl_qwen3_0p6b_no_retrans_logcost_hard/autoreg_policy_best.pt
  out: results/benchmark_qwen3_0p6b_no_retrans_logcost_hard_5seed
  states: 64
  seeds: "91,92,93,94,95"
  beam_width: 32
  anneal_steps: 128
  autoreg_candidates: 256
  device: cuda
