# Qwen3.5-4B no-retransmission 消融配置。
# 目标：和 Qwen3-0.6B 的 r=0 结果保持同一套实验口径：
# 1. wireless.retransmissions=0，残余 activation loss 使用 raw PDP。
# 2. reward.ppl_cost_mode=log，reward 中的 PPL 项使用 log(1 + PPL_norm)，避免 raw PDP 下极端 PPL outlier 主导训练。
# 3. profile.real_profile_dir 使用已校准的 Qwen3.5-4B layer-wise hidden-state PPL profile。
seed: 42

profile:
  model_name: Qwen3.5-4B
  num_layers: 32
  hidden_size: 2560
  intermediate_size: 9216
  num_attention_heads: 16
  num_key_value_heads: 4
  head_dim: 256
  dtype_bytes: 2
  sequence_length: 64
  ppl_ref: 12.508157074727082
  ppl_gamma: 196.06855947881232
  real_profile_dir: results/qwen35_4b/qwen35_4b_real_profile_v2
  surrogate_mode: mlp
  layer_compute_jitter: 0.12
  activation_jitter: 0.08

uav:
  num_uavs: 5
  area_m: 1000.0
  altitude_m: 100.0
  compute_ghz_min: 3.5
  compute_ghz_max: 8.0
  mem_mb_min: 1800.0
  mem_mb_max: 3200.0
  energy_j_min: 2000.0
  energy_j_max: 3600.0
  tx_power_w: 1.0
  compute_power_base_w: 1.5
  compute_power_per_ghz_w: 0.45
  hover_power_w_min: 35.0
  hover_power_w_max: 70.0

wireless:
  bandwidth_hz: 2000000.0
  bandwidth_allocation: kkt_closed_form
  noise_power_w: 1.0e-12
  snr_threshold: 10.0
  h0: 1.0e-05
  path_loss_exp: 2.15
  rayleigh_scale: 1.0
  min_rate_bps: 1000.0
  retransmissions: 0

reward:
  alpha: 0.4
  beta: 0.6
  ppl_cost_mode: log
  ppl_cost_cap: null
  infeasible_reward: -100.0
  latency_ref_s: 20.0
  repair_energy_iters: 4

heuristics:
  include_simple_heuristics_in_dros: true
  local_search_passes: 2
  local_search_seed_tries: 64
  include_local_search_in_dros: true
  evaluate_strong_baseline: true

ar_rl:
  result_dir: results/qwen35_4b/autoreg_rl_qwen35_4b_no_retrans_logcost_hard2
  episodes: 600
  batch_states: 32
  candidates: 256
  eval_candidates: 256
  validation_states: 160
  eval_interval: 50
  elite_fraction: 0.08
  replay_capacity: 100000
  batch_size: 512
  replay_updates_per_step: 1
  learning_rate: 0.0004
  weight_decay: 0.0001
  hidden_dim: 512
  depth: 3
  dropout: 0.03
  temperature_start: 1.2
  temperature_end: 0.35
  eval_temperature: 0.30
  eval_temperatures: [0.12, 0.2, 0.3, 0.45]
  greedy_candidates: 1
  policy_refine_steps: 0
  policy_refine_extra_candidates: 128
  policy_refine_temp_start: 0.02
  policy_refine_temp_end: 0.001
  entropy_coef_start: 0.02
  entropy_coef_end: 0.002
  advantage_scale: 4.0
  reward_clip: 8.0
  infeasible_penalty: 2.5
  infeasible_cost_weight: 0.02
  grad_clip: 1.0
  teacher_states: 0
  teacher_updates: 0
  teacher_beam_width: 32
  teacher_anneal_steps: 128
  teacher_eval_interval: 200
  teacher_top_k: 6
  teacher_weight_tau: 0.012
  teacher_min_margin: 0.03
  projection_mode: blocks_fast
  max_blocks: 5
  candidate_mode: beam
  candidate_overgenerate: 1
  beam_temperature: 0.9
  hard_baseline: best_nonrl
  hard_benchmark_rows: results/qwen35_4b/autoreg_rl_qwen35_4b_no_retrans_logcost_hard2/hard_states_used.csv
  hard_margin_threshold: 0.0
  hard_max_states: 160
  hard_fraction: 0.75
  hard_weight_scale: 200.0
  hard_max_weight: 24.0
  hard_teacher_repeats: 16
  device: cuda

benchmark:
  real_dir: results/qwen35_4b/qwen35_4b_real_profile_v2
  policy: results/qwen35_4b/autoreg_rl_qwen35_4b_no_retrans_logcost_hard2/autoreg_policy_best.pt
  out: results/qwen35_4b/benchmark_qwen35_4b_no_retrans_logcost_hard2_k1024_fast_5seed
  states: 64
  seeds: "91,92,93,94,95"
  beam_width: 32
  anneal_steps: 128
  autoreg_candidates: 1024
  projection_mode: blocks_fast
  candidate_overgenerate: 1
  device: cuda

output:
  result_dir: results/qwen35_4b/dros_qwen35_4b_no_retrans_logcost
